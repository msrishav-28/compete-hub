services:
  # ------------------------------------------------------------------
  # Web API
  # ------------------------------------------------------------------
  - type: web
    name: competehub-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false   # Supabase Postgres connection string
      - key: CORS_ORIGINS
        sync: false   # https://your-frontend.vercel.app
      - key: ADMIN_KEY
        sync: false   # Long random string, required for POST /api/refresh
      - key: KAGGLE_USERNAME
        sync: false   # Optional — enables the Kaggle fetcher
      - key: KAGGLE_KEY
        sync: false   # Optional — enables the Kaggle fetcher
      - key: CLIST_USERNAME
        sync: false   # Optional — enables the clist.by fetcher
      - key: CLIST_API_KEY
        sync: false   # Optional — enables the clist.by fetcher

  # ------------------------------------------------------------------
  # Scheduled refresh — runs every 6 hours, completely separate from
  # the API process. Honours the same TTL so it costs us nothing when
  # nothing has changed.
  # ------------------------------------------------------------------
  - type: cron
    name: competehub-refresh
    runtime: python
    region: oregon
    plan: free
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.cron refresh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
      - key: CLIST_USERNAME
        sync: false
      - key: CLIST_API_KEY
        sync: false
